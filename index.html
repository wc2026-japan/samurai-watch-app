<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SAMURAI WATCH | 海外組フォローアプリ</title>
<meta name="description" content="海外組の日本人選手に関する試合結果・移籍ニュースと、サムライウォッチの記事をまとめてチェックできるアプリ" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0c0c0f" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap');

  :root {
    --bg: #0c0c0f;
    --bg-header: rgba(12,12,15,0.95);
    --card: #16161a;
    --border: #262629;
    --border-hover: #3a3a42;
    --text: #F2EFEA;
    --text-muted: #9a9aa2;
    --text-faint: #6b6b73;
    --text-fainter: #5b5f66;
    --red: #C81E3A;
    --red-hover: #b01a33;
    --gold: #B8934D;
    --blue: #7C9CBF;
    --green: #6FA98A;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .font-display { font-family: 'Oswald', 'Noto Sans JP', sans-serif; }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg-header);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 8px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1;
    margin: 0;
  }
  h1 span { color: var(--red); }
  .tagline { font-size: 11px; color: var(--text-faint); margin: 4px 0 0; }

  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn:hover { border-color: var(--border-hover); color: var(--text); }

  main {
    padding: 18px 18px 100px;
    max-width: 512px;
    margin: 0 auto;
  }

  /* ---- section heading (WC2026-guide inspired) ---- */
  .section-eyebrow {
    font-family: 'Oswald', sans-serif;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--accent, var(--red));
    margin: 0 0 4px;
  }
  .section-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 16px;
    letter-spacing: 0.2px;
  }

  /* ---- today's digest ---- */
  .digest-card {
    border-radius: 14px;
    border: 1px solid rgba(200,30,58,0.35);
    background: linear-gradient(135deg, rgba(200,30,58,0.12) 0%, rgba(23,20,26,0.4) 60%);
    padding: 16px;
    margin-bottom: 18px;
  }
  .digest-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--red);
    margin: 0 0 10px;
  }
  .digest-item {
    display: block;
    text-decoration: none;
    color: inherit;
    padding: 8px 0;
  }
  .digest-item + .digest-item { border-top: 1px solid rgba(255,255,255,0.08); }
  .digest-item-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .digest-item-meta {
    font-size: 10.5px;
    color: var(--text-faint);
    margin-top: 3px;
  }

  /* ---- LIVE DATA banner ---- */
  .live-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #17141a;
    padding: 11px 16px;
    margin-bottom: 20px;
  }
  .live-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    color: var(--red);
  }
  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--red);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(200,30,58,0.5); }
    50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(200,30,58,0); }
  }
  .live-times {
    text-align: right;
    font-size: 11px;
    color: var(--text-faint);
    line-height: 1.5;
  }
  .live-times b { color: var(--text-muted); font-weight: 600; }

  /* ---- FILTER chips ---- */
  .filter-block { margin-bottom: 18px; }
  .filter-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: var(--accent, var(--red));
    margin-bottom: 8px;
  }
  .filter-label .filter-tag {
    font-family: 'Oswald', sans-serif;
  }
  .filter-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .filter-chip.active {
    color: var(--bg);
    background: var(--accent, var(--red));
    border-color: var(--accent, var(--red));
    font-weight: 700;
  }

  /* ---- NEW badge ---- */
  .new-badge {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    color: #fff;
    background: var(--red);
    border-radius: 4px;
    padding: 1px 5px;
    margin-left: 6px;
    vertical-align: 1px;
  }

  /* ---- standard card ---- */
  .card {
    display: block;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--card);
    padding: 18px;
    margin-bottom: 14px;
    text-decoration: none;
    color: inherit;
  }
  .card:hover { border-color: var(--border-hover); }
  .card:hover h3 { color: #fff; }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 9px;
  }
  .card-source {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .card-date { font-size: 11px; color: var(--text-faint); flex-shrink: 0; }
  .card h3 {
    font-size: 15px;
    line-height: 1.45;
    font-weight: 600;
    margin: 0 0 5px;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card p {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.55;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-open {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
    font-size: 11px;
    color: var(--text-fainter);
  }
  .card-thumb {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 10px;
    margin-bottom: 12px;
    background: var(--bg);
    display: block;
  }

  .empty { text-align: center; padding: 64px 24px; color: #8a8a92; font-size: 14px; }

  .app-footer {
    text-align: center;
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .footer-link {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 11px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
    font-family: inherit;
  }
  .footer-dot { color: var(--text-fainter); font-size: 11px; }

  .info-modal-body {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.7;
  }
  .info-modal-body h3 {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text);
    margin: 18px 0 6px;
  }
  .info-modal-body h3:first-child { margin-top: 0; }
  .info-modal-body a { color: var(--blue); text-decoration: underline; }
  .info-modal-body .info-note {
    margin-top: 16px;
    font-size: 11px;
    color: var(--text-fainter);
  }

  /* ---- timeline (速報) ---- */
  .timeline {
    position: relative;
    padding-left: 20px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 6px;
    bottom: 6px;
    width: 1px;
    background: var(--border);
  }
  .timeline-item {
    position: relative;
    margin-bottom: 18px;
  }
  .timeline-dot {
    position: absolute;
    left: -20px;
    top: 5px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--red);
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--border);
  }
  .timeline-time {
    font-size: 11px;
    color: var(--text-faint);
    font-weight: 600;
    margin-bottom: 6px;
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.3px;
  }

  /* ---- transfer card (移籍) ---- */
  .transfer-flow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 9px;
  }
  .transfer-names {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    min-width: 0;
  }
  .transfer-names .dest {
    color: var(--gold);
  }
  .transfer-arrow { color: var(--text-fainter); flex-shrink: 0; }
  .status-badge {
    flex-shrink: 0;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: 2px 9px;
  }
  .transfer-caption {
    font-size: 12.5px;
    color: var(--text-muted);
    line-height: 1.55;
    margin: 0 0 9px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ---- WC guide link card ---- */
  .promo-card {
    display: flex;
    align-items: center;
    gap: 12px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: linear-gradient(135deg, #1c1116 0%, #17141a 100%);
    padding: 14px 16px;
    margin-bottom: 20px;
    text-decoration: none;
    color: inherit;
  }
  .promo-card:hover { border-color: var(--border-hover); }
  .promo-icon {
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: var(--red);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .promo-text { min-width: 0; }
  .promo-title { font-size: 13.5px; font-weight: 700; color: var(--text); margin: 0 0 2px; }
  .promo-sub { font-size: 11.5px; color: var(--text-faint); margin: 0; }

  .x-embed-card {
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--card);
    overflow: hidden;
    margin-bottom: 14px;
  }
  .x-embed-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 16px 4px;
  }
  .x-embed-header .card-source { color: var(--blue); }
  .x-embed-body { padding: 0 2px 2px; }

  /* ---- players tab ---- */
  .players-note {
    font-size: 11px;
    color: var(--text-faint);
    line-height: 1.5;
    margin: 0 0 18px;
  }
  .position-group { margin-bottom: 22px; }
  .position-label {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--green);
    margin: 0 0 10px;
  }
  .player-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .player-card {
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    padding: 12px 13px;
    text-align: left;
    width: 100%;
    font-family: inherit;
    cursor: pointer;
    color: inherit;
  }
  .player-card:hover { border-color: var(--border-hover); }
  .player-top {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 3px;
  }
  .player-number {
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-fainter);
  }
  .player-name { font-size: 13.5px; font-weight: 700; color: var(--text); }
  .player-keyman { color: var(--green); font-size: 11px; margin-right: 1px; }
  .player-club {
    font-size: 11.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .player-league-tag {
    display: inline-block;
    font-size: 9.5px;
    font-weight: 600;
    color: var(--green);
    background: rgba(111,169,138,0.12);
    border-radius: 4px;
    padding: 1px 6px;
    margin-top: 5px;
  }

  .leagues-overview {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .leagues-overview-label {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--green);
    margin: 0 0 4px;
  }
  .leagues-overview-sub {
    font-size: 11px;
    color: var(--text-faint);
    margin: 0 0 14px;
  }
  .league-accordion {
    border-top: 1px solid var(--border);
  }
  .league-accordion:first-of-type { border-top: none; }
  .league-accordion summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 13px 2px;
    cursor: pointer;
    list-style: none;
  }
  .league-accordion summary::-webkit-details-marker { display: none; }
  .league-accordion summary::marker { content: ""; }
  .league-summary-left {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }
  .league-overview-name { font-size: 13.5px; font-weight: 700; color: var(--text); }
  .league-overview-country { font-size: 11px; color: var(--text-faint); flex-shrink: 0; }
  .league-chevron {
    flex-shrink: 0;
    color: var(--text-fainter);
    font-size: 13px;
    transition: transform 0.15s ease;
  }
  .league-accordion[open] .league-chevron { transform: rotate(90deg); color: var(--green); }
  .league-overview-desc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
    margin: 0 0 14px;
    padding: 0 2px;
  }
  .player-status {
    font-size: 10.5px;
    color: #d98a6a;
    margin-top: 2px;
  }
  .player-card.is-inactive { opacity: 0.55; }

  /* ---- player detail modal ---- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(0,0,0,0.65);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-sheet {
    width: 100%;
    max-width: 512px;
    max-height: 82vh;
    overflow-y: auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    padding: 22px 20px 28px;
    animation: sheet-up 0.18s ease-out;
  }
  @keyframes sheet-up {
    from { transform: translateY(16px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 16px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .modal-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 4px;
  }
  .modal-number-badge {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--green);
  }
  .modal-name { font-size: 19px; font-weight: 700; color: var(--text); margin: 0; }
  .modal-position { font-size: 11.5px; color: var(--green); font-weight: 700; letter-spacing: 0.5px; margin: 2px 0 0; }
  .modal-club-row {
    margin: 16px 0 4px;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 13.5px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .modal-club-row b { color: var(--text); font-weight: 700; }
  .modal-section-label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: var(--text-faint);
    margin: 20px 0 10px;
  }
  .modal-news-item {
    display: block;
    padding: 12px 0;
    border-top: 1px solid var(--border);
    text-decoration: none;
    color: inherit;
  }
  .modal-news-item:first-child { border-top: none; }
  .modal-news-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    margin: 0 0 3px;
  }
  .modal-news-meta { font-size: 11px; color: var(--text-faint); }
  .modal-fallback {
    font-size: 12.5px;
    color: var(--text-faint);
    line-height: 1.6;
    margin: 4px 0 12px;
  }
  .modal-search-link {
    display: inline-block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--green);
    text-decoration: none;
  }
  .sns-row {
    display: flex;
    gap: 8px;
    margin: 4px 0 4px;
  }
  .sns-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 13px;
    text-decoration: none;
  }
  .sns-btn.is-fallback { color: var(--text-faint); }

  /* ---- search overlay ---- */
  .search-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  .search-top {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .search-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    color: var(--text);
    font-family: inherit;
  }
  .search-input::placeholder { color: var(--text-fainter); }
  .search-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 40px;
    max-width: 512px;
    margin: 0 auto;
    width: 100%;
  }
  .search-group-label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: var(--text-faint);
    margin: 18px 0 8px;
  }
  .search-group-label:first-child { margin-top: 0; }
  .search-player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    margin-bottom: 8px;
    cursor: pointer;
  }
  .search-player-row .player-name { font-size: 14px; }
  .search-player-row .player-club { margin-top: 2px; }

  /* ---- glossary ---- */
  .glossary-item { padding: 12px 0; border-top: 1px solid var(--border); }
  .glossary-item:first-child { border-top: none; }

</style>

<script>
const ACCENTS = { scores: "#C81E3A", transfers: "#B8934D", players: "#6FA98A", articles: "#7C9CBF" };
const SECTION_HEADINGS = {
  scores: { eyebrow: "NEWS", title: "海外組速報" },
  transfers: { eyebrow: "TRANSFER", title: "海外移籍情報" },
  players: { eyebrow: "SQUAD", title: "日本代表メンバー" },
  articles: { eyebrow: "ARTICLES", title: "関連ニュース" },
};
const NEW_THRESHOLD_MS = 24 * 60 * 60 * 1000; // 24 hours

// Mirrors the same whitelist used in scripts/fetch-news.mjs. Trusted
// football media are shown first, but nothing is ever excluded here —
// this only affects display order.
const TRUSTED_SOURCE_PATTERN = /サッカーキング|ゲキサカ|gekisaka|goal\.com|football\s*zone|フットボールゾーン|サッカーダイジェスト|soccer\s*digest|footballchannel|フットボールチャンネル/i;

function isTrustedSource(item) {
  return TRUSTED_SOURCE_PATTERN.test(item.source || "") || TRUSTED_SOURCE_PATTERN.test(item.link || "");
}

function prioritizeAndSort(items) {
  const sorted = [...items].sort((a, b) => {
    const da = new Date(a.pubDate).getTime();
    const db = new Date(b.pubDate).getTime();
    return (isNaN(db) ? -Infinity : db) - (isNaN(da) ? -Infinity : da);
  });
  const trusted = sorted.filter(isTrustedSource);
  const others = sorted.filter((item) => !isTrustedSource(item));
  return [...trusted, ...others];
}
const WC_GUIDE_URL = "https://wc2026-japan.github.io/guide/";

const SCORE_FILTERS = [
  { id: "all", label: "すべて" },
  { id: "goal", label: "ゴール" },
  { id: "appearance", label: "出場" },
  { id: "transfer", label: "移籍" },
  { id: "nt", label: "代表" },
  { id: "news", label: "ニュース" },
];
const TRANSFER_FILTERS = [
  { id: "all", label: "すべて" },
  { id: "decided", label: "決定" },
  { id: "rumor", label: "噂" },
];

const GLOSSARY = [
  { term: "完全移籍", desc: "選手の登録を完全に別クラブへ譲渡する移籍。レンタルと違い、元のクラブには自動的には戻らない。" },
  { term: "レンタル移籍(期限付き移籍)", desc: "契約はそのままに、一定期間だけ別クラブでプレーする移籍。期間が終われば元クラブに復帰するのが基本。" },
  { term: "買取オプション", desc: "レンタル移籍の契約に付随し、条件を満たせば移籍先クラブがそのまま完全移籍として選手を獲得できる権利。" },
  { term: "移籍金", desc: "選手の契約を保有するクラブに対して、獲得する側のクラブが支払う金額。" },
  { term: "移籍金非公開", desc: "移籍が成立したものの、実際に支払われた移籍金の金額をクラブ側が公表していない状態。" },
  { term: "背番号", desc: "各選手に割り当てられる、ユニフォームに入る試合用の番号。" },
  { term: "先発 / スタメン", desc: "試合開始の時点からピッチに立つ11人のこと。" },
  { term: "途中出場", desc: "試合の途中で交代選手としてピッチに入ること。" },
  { term: "クリーンシート", desc: "GKやDFが、試合を無失点(0失点)で終えること。" },
  { term: "アシスト", desc: "得点に直接つながるパスやプレーを記録すること。" },
  { term: "個人合意", desc: "選手と獲得を目指すクラブの間で、契約条件について合意ができている状態。クラブ間の移籍金交渉が別途必要な場合が多い。" },
  { term: "移籍リンク(交渉中)", desc: "正式契約の前段階で、クラブ間または選手との交渉が進んでいる状態。決定ではない点に注意。" },
];

const state = {
  activeTab: "scores",
  scores: null,
  transfers: null,
  players: null,
  articles: null,
  config: null,
  scoreFilter: "all",
  transferFilter: "all",
  selectedPlayer: null, // { number, name, club, country, position }
  searchOpen: false,
  searchQuery: "",
};

async function loadJSON(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function isNew(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return false;
  return Date.now() - d.getTime() < NEW_THRESHOLD_MS;
}

function timeAgo(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return "";
  const diffMs = Date.now() - d.getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "たった今";
  if (mins < 60) return `${mins}分前`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}時間前`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}日前`;
  return d.toLocaleDateString("ja-JP", { month: "short", day: "numeric" });
}

function timeLabel(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return "";
  return d.toLocaleString("ja-JP", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function newBadge(item) {
  return isNew(item.pubDate) ? `<span class="new-badge">NEW</span>` : "";
}

function promoCard() {
  return `
    <a class="promo-card" href="${WC_GUIDE_URL}" target="_blank" rel="noopener noreferrer">
      <span class="promo-icon">🏆</span>
      <span class="promo-text">
        <p class="promo-title">W杯2026 全104試合ガイドを見る</p>
        <p class="promo-sub">WC2026 GUIDE JAPAN で日程・結果・放送局をチェック</p>
      </span>
    </a>
  `;
}

/* Today's digest: pulls the most recent 1-2 items across scores + transfers
   (whichever is freshest), so opening the app answers "what happened
   today" without needing to pick a tab first. Only uses real fetched
   items — shows nothing if there's genuinely nothing recent. */
function renderDigest() {
  const el = document.getElementById("digestBlock");
  if (state.activeTab !== "scores" && state.activeTab !== "transfers") {
    el.innerHTML = "";
    return;
  }
  if (!state.scores || !state.transfers) {
    el.innerHTML = "";
    return;
  }
  const pool = [
    ...(state.scores.items || []).map((i) => ({ ...i, _tab: "速報", _accent: ACCENTS.scores })),
    ...(state.transfers.items || []).map((i) => ({ ...i, _tab: "移籍", _accent: ACCENTS.transfers })),
  ]
    .filter((i) => !isNaN(new Date(i.pubDate).getTime()))
    .sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate))
    .slice(0, 2);

  if (pool.length === 0) {
    el.innerHTML = "";
    return;
  }

  el.innerHTML = `
    <div class="digest-card">
      <p class="digest-label">🔴 今日のダイジェスト</p>
      ${pool.map((item) => `
        <a class="digest-item" href="${item.link}" target="_blank" rel="noopener noreferrer">
          <div class="digest-item-title">${item.title}</div>
          <div class="digest-item-meta" style="color:${item._accent}">${item._tab} ・ ${timeAgo(item.pubDate)}</div>
        </a>
      `).join("")}
    </div>
  `;
}

/* ---- Keyword-based categorization. Only uses words that actually appear
   in the title/description — no invented categories. ---- */
function scoreCategory(item) {
  const t = `${item.title || ""} ${item.description || ""}`;
  if (/ゴール|得点|決勝弾|挙げ/.test(t)) return "goal";
  if (/移籍/.test(t)) return "transfer";
  if (/代表/.test(t)) return "nt";
  if (/出場|先発|途中出場|フル出場/.test(t)) return "appearance";
  return "news";
}

function transferCategory(item) {
  const t = item.title || "";
  if (/決定|正式|合意|内定/.test(t)) return "decided";
  if (/噂|報道|浮上|関心|オファー|接触/.test(t)) return "rumor";
  return "other";
}

/* Best-effort transfer parsing. Only returns a structured result when the
   title clearly follows a "選手名、移籍先クラブへ(完全)移籍..." pattern.
   Anything else falls back to a normal news card — never invent a
   destination club or status that isn't actually in the text. */
function parseTransfer(item) {
  const title = item.title || "";
  if (!title.includes("移籍")) return null;
  const commaIdx = title.indexOf("、");
  if (commaIdx === -1) return null;
  const namePart = title.slice(0, commaIdx).trim();
  const restPart = title.slice(commaIdx + 1).trim();
  const destMatch = restPart.match(/^(.+?)(へ|に)?(の)?(完全)?移籍/);
  if (!destMatch || !destMatch[1]) return null;
  const dest = destMatch[1].trim();
  if (!dest || dest.length > 18 || namePart.length > 14) return null;

  let status = null;
  if (title.includes("決定")) status = "決定";
  else if (title.includes("正式")) status = "正式発表";
  else if (title.includes("合意")) status = "合意";
  else if (title.includes("内定")) status = "内定";
  else if (title.includes("交渉")) status = "交渉中";

  return { name: namePart, dest, status };
}

function renderTimelineCard(item, accent) {
  return `
    <div class="timeline-item">
      <span class="timeline-dot" style="background:${accent}"></span>
      <div class="timeline-time">${timeLabel(item.pubDate)}${newBadge(item)}</div>
      <a class="card" href="${item.link}" target="_blank" rel="noopener noreferrer">
        ${item.image ? `<img class="card-thumb" src="${item.image}" alt="" loading="lazy" onerror="this.remove()" />` : ""}
        <div class="card-top">
          <span class="card-source" style="color:${accent}">${item.source || "ニュース"}</span>
          <span class="card-date">${timeAgo(item.pubDate)}</span>
        </div>
        <h3>${item.title}</h3>
        <p>${item.description || ""}</p>
        <div class="card-open">開く</div>
      </a>
    </div>
  `;
}

function renderTransferCard(item, accent) {
  const transfer = parseTransfer(item);
  if (!transfer) {
    return `
      <a class="card" href="${item.link}" target="_blank" rel="noopener noreferrer">
        ${item.image ? `<img class="card-thumb" src="${item.image}" alt="" loading="lazy" onerror="this.remove()" />` : ""}
        <div class="card-top">
          <span class="card-source" style="color:${accent}">${item.source || "ニュース"}</span>
          <span class="card-date">${timeAgo(item.pubDate)}${newBadge(item)}</span>
        </div>
        <h3>${item.title}</h3>
        <p>${item.description || ""}</p>
        <div class="card-open">開く</div>
      </a>
    `;
  }
  return `
    <a class="card" href="${item.link}" target="_blank" rel="noopener noreferrer">
      ${item.image ? `<img class="card-thumb" src="${item.image}" alt="" loading="lazy" onerror="this.remove()" />` : ""}
      <div class="card-top">
        <span class="card-source" style="color:${accent}">${item.source || "ニュース"}</span>
        <span class="card-date">${timeAgo(item.pubDate)}${newBadge(item)}</span>
      </div>
      <div class="transfer-flow">
        <span class="transfer-names">🇯🇵&nbsp;${transfer.name}&nbsp;<span class="transfer-arrow">→</span>&nbsp;<span class="dest">${transfer.dest}</span></span>
        ${transfer.status ? `<span class="status-badge">${transfer.status}</span>` : ""}
      </div>
      <p class="transfer-caption">${item.title}</p>
      <div class="card-open">詳細を見る</div>
    </a>
  `;
}

function renderXFallbackCard() {
  const xUser = state.config?.xUser || "coin0115";
  return `
    <a class="promo-card" href="https://x.com/${encodeURIComponent(xUser)}" target="_blank" rel="noopener noreferrer">
      <span class="promo-icon">𝕏</span>
      <span class="promo-text">
        <p class="promo-title">Xで最新投稿を見る</p>
        <p class="promo-sub">@${xUser} (埋め込み表示が利用できないため、直接リンクします)</p>
      </span>
    </a>
  `;
}

/* X's embed timeline is unreliable as of 2026 — it frequently just shows
   the "Tweets by ~" fallback text forever, especially for viewers not
   logged into X. There's no way to fix that from our side, so instead we
   wait a few seconds and swap it for a plain link if it never rendered. */
function scheduleTwitterFallbackCheck(container) {
  setTimeout(() => {
    if (state.activeTab !== "articles") return;
    const anchor = container.querySelector("a.twitter-timeline");
    if (!anchor) return; // it rendered successfully (replaced with an iframe)
    const embedCard = container.querySelector(".x-embed-card");
    if (embedCard) {
      embedCard.outerHTML = renderXFallbackCard();
    }
  }, 4000);
}

function renderArticlesTab() {
  const user = state.config?.noteUser || "samurai_watch";
  const xUser = state.config?.xUser || "coin0115";

  const xEmbed = `
    <div class="x-embed-card">
      <div class="x-embed-header">
        <span class="card-source">X (旧Twitter)</span>
      </div>
      <div class="x-embed-body">
        <a class="twitter-timeline" data-height="480" data-theme="dark" data-chrome="noheader nofooter noborders transparent" href="https://twitter.com/${encodeURIComponent(xUser)}?ref_src=twsrc%5Etfw">@${xUser} の投稿を読み込み中...</a>
      </div>
    </div>
  `;

  const linkOut = `
    <a class="promo-card" href="https://note.com/${encodeURIComponent(user)}" target="_blank" rel="noopener noreferrer">
      <span class="promo-icon">📝</span>
      <span class="promo-text">
        <p class="promo-title">note.comで全記事を見る</p>
        <p class="promo-sub">note.com/${user}</p>
      </span>
    </a>
  `;

  const feed = state.articles;
  if (!feed) {
    return xEmbed + linkOut + `<div class="empty">読み込み中...</div>`;
  }
  if (feed.items.length === 0) {
    return xEmbed + linkOut + `<div class="empty">記事が見つかりませんでした。</div>`;
  }
  const cards = feed.items
    .map((item) => renderTimelineStyleArticleCard(item))
    .join("");
  return xEmbed + linkOut + cards;
}

function renderTimelineStyleArticleCard(item) {
  return `
    <a class="card" href="${item.link}" target="_blank" rel="noopener noreferrer">
      ${item.image ? `<img class="card-thumb" src="${item.image}" alt="" loading="lazy" onerror="this.remove()" />` : ""}
      <div class="card-top">
        <span class="card-source" style="color:${ACCENTS.articles}">${item.source || "note.com"}</span>
        <span class="card-date">${timeAgo(item.pubDate)}${newBadge(item)}</span>
      </div>
      <h3>${item.title}</h3>
      <p>${item.description || ""}</p>
      <div class="card-open">開く</div>
    </a>
  `;
}

function renderPlayersTab() {
  if (!state.players) return `<div class="empty">読み込み中...</div>`;
  const data = state.players;
  const groups = data.positions.map((group) => `
    <div class="position-group">
      <p class="position-label">${group.label}</p>
      <div class="player-grid">
        ${group.players.map((p) => `
          <button class="player-card ${p.status ? "is-inactive" : ""}" data-player-number="${p.number}" data-position="${group.code}">
            <div class="player-top">
              <span class="player-number">${p.number}</span>
              ${p.keyman ? `<span class="player-keyman">◇</span>` : ""}
              <span class="player-name">${p.name}</span>
            </div>
            <div class="player-club">${p.country || ""} ${p.club}</div>
            ${p.league ? `<div><span class="player-league-tag">${p.league}</span></div>` : ""}
            ${p.status ? `<div class="player-status">${p.status}</div>` : ""}
          </button>
        `).join("")}
      </div>
    </div>
  `).join("");
  const note = data.note ? `<p class="players-note">${data.note}</p>` : "";
  return note + groups + renderLeaguesOverview(data.leagues);
}

function renderLeaguesOverview(leagues) {
  if (!leagues) return "";
  const entries = Object.entries(leagues);
  if (entries.length === 0) return "";
  return `
    <div class="leagues-overview">
      <p class="leagues-overview-label">LEAGUES</p>
      <p class="leagues-overview-sub">選手が所属する${entries.length}つのリーグについて</p>
      ${entries.map(([name, info]) => `
        <details class="league-accordion">
          <summary>
            <span class="league-summary-left">
              <span class="league-overview-name">${name}</span>
              <span class="league-overview-country">${info.country || ""}</span>
            </span>
            <span class="league-chevron">›</span>
          </summary>
          <p class="league-overview-desc">${info.desc || ""}</p>
        </details>
      `).join("")}

  `;
}

/* Cross-reference this player's name against the real scores/transfers feeds.
   Only real fetched items are shown — nothing fabricated. */
function findPlayerNews(playerName) {
  const key = playerName.replace(/\s+/g, "");
  const pools = [
    ...(state.scores?.items || []).map((i) => ({ ...i, _tab: "速報" })),
    ...(state.transfers?.items || []).map((i) => ({ ...i, _tab: "移籍" })),
  ];
  return pools
    .filter((item) => (item.title || "").replace(/\s+/g, "").includes(key))
    .slice(0, 6);
}

function renderLeagueSection(p) {
  if (!p.league) return "";
  const info = state.players?.leagues?.[p.league];
  return `
    <p class="modal-section-label">LEAGUE</p>
    <div class="modal-club-row" style="display:block;">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:${info ? "6px" : "0"};">
        <b>${p.league}</b>
        ${info?.country ? `<span style="color:var(--text-faint); font-size:11.5px;">${info.country}</span>` : ""}
      </div>
      ${info?.desc ? `<p style="margin:0; font-size:12px; color:var(--text-muted); line-height:1.6;">${info.desc}</p>` : ""}
    </div>
  `;
}

function renderSnsRow(p) {
  if (p.sns && p.sns.instagram) {
    return `

        <a class="sns-btn" href="https://www.instagram.com/${encodeURIComponent(p.sns.instagram)}/" target="_blank" rel="noopener noreferrer">

        </a>

  }
  const q = encodeURIComponent(`${p.name} Instagram`);
  return `
    <div class="sns-row">
      <a class="sns-btn is-fallback" href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener noreferrer">
        🔍 SNSを検索
      </a>
    </div>

}

function openPlayerModal(number, positionCode) {
  const group = state.players.positions.find((g) => g.code === positionCode);
  const player = group?.players.find((p) => String(p.number) === String(number));
  if (!player) return;
  state.selectedPlayer = { ...player, position: group.label };
  renderModal();
}

function closePlayerModal() {
  state.selectedPlayer = null;
  renderModal();
}

function renderModal() {
  const root = document.getElementById("modalRoot");
  if (!state.selectedPlayer) {
    root.innerHTML = "";
    return;
  }
  const p = state.selectedPlayer;
  const news = findPlayerNews(p.name);
  const searchQuery = encodeURIComponent(`${p.name} ${p.club}`);

  const newsHtml = news.length
    ? news.map((item) => `
        <a class="modal-news-item" href="${item.link}" target="_blank" rel="noopener noreferrer">
          <p class="modal-news-title">${item.title}</p>

    : `

        <a class="modal-search-link" href="https://news.google.com/search?q=${searchQuery}&hl=ja&gl=JP&ceid=JP:ja" target="_blank" rel="noopener noreferrer">Googleニュースで検索する →</a>
      `;

  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">

/* ---- keyword search (across scores, transfers, articles, players) ---- */
function openSearch() {
  state.searchOpen = true;
  state.searchQuery = "";
  renderSearch();
  setTimeout(() => {
    const input = document.getElementById("searchInput");
    if (input) input.focus();
  }, 30);
}

function closeSearch() {
  state.searchOpen = false;
  document.getElementById("searchRoot").innerHTML = "";
}

function runSearch(query) {
  const q = query.trim().toLowerCase();
  if (!q) return { news: [], players: [] };

  const newsPool = [
    ...(state.scores?.items || []).map((i) => ({ ...i, _tab: "速報", _accent: ACCENTS.scores })),
    ...(state.transfers?.items || []).map((i) => ({ ...i, _tab: "移籍", _accent: ACCENTS.transfers })),
    ...(state.articles?.items || []).map((i) => ({ ...i, _tab: "記事", _accent: ACCENTS.articles })),
  ].filter((i) => `${i.title} ${i.description || ""}`.toLowerCase().includes(q));

  const playerPool = [];
  if (state.players) {
    state.players.positions.forEach((group) => {
      group.players.forEach((p) => {
        if (`${p.name} ${p.club}`.toLowerCase().includes(q)) {
          playerPool.push({ ...p, _position: group.label, _code: group.code });
        }
      });
    });
  }

  return { news: newsPool.slice(0, 20), players: playerPool };
}

function renderSearch() {
  const root = document.getElementById("searchRoot");
  if (!state.searchOpen) {
    root.innerHTML = "";
    return;
  }
  const results = runSearch(state.searchQuery);
  const hasQuery = state.searchQuery.trim().length > 0;
  const total = results.news.length + results.players.length;

  let bodyHtml;
  if (!hasQuery) {
    bodyHtml = `<div class="empty">選手名・クラブ名・キーワードで検索できます</div>`;
  } else if (total === 0) {
    bodyHtml = `<div class="empty">「${state.searchQuery}」に一致する情報が見つかりませんでした</div>`;
  } else {
    const playersHtml = results.players.length
      ? `<p class="search-group-label">選手 (${results.players.length})</p>` +
        results.players.map((p) => `
          <div class="search-player-row" data-player-number="${p.number}" data-position="${p._code}">
            <div>
              <div class="player-top" style="margin-bottom:2px;">
                <span class="player-number">${p.number}</span>
                <span class="player-name">${p.name}</span>
              </div>
              <div class="player-club">${p.country || ""} ${p.club}</div>
            </div>
            <span style="color:var(--text-fainter); font-size:12px;">${p._position}</span>
          </div>
        `).join("")
      : "";

    const newsHtml = results.news.length
      ? `<p class="search-group-label">ニュース・記事 (${results.news.length})</p>` +
        results.news.map((item) => `
          <a class="card" href="${item.link}" target="_blank" rel="noopener noreferrer">
            ${item.image ? `<img class="card-thumb" src="${item.image}" alt="" loading="lazy" onerror="this.remove()" />` : ""}
            <div class="card-top">
              <span class="card-source" style="color:${item._accent}">${item._tab} ・ ${item.source || ""}</span>
              <span class="card-date">${timeAgo(item.pubDate)}</span>
            </div>
            <h3>${item.title}</h3>
            <p>${item.description || ""}</p>
            <div class="card-open">開く</div>
          </a>
        `).join("")
      : "";

    bodyHtml = playersHtml + newsHtml;
  }

  root.innerHTML = `
    <div class="search-overlay" id="searchOverlayEl">
      <div class="search-top">
        <input class="search-input" id="searchInput" type="text" placeholder="選手名やチームで検索" value="${state.searchQuery.replace(/"/g, "&quot;")}" />
        <button class="icon-btn" id="searchCloseBtn" aria-label="閉じる">✕</button>
      </div>
      <div class="search-body" id="searchBody">${bodyHtml}</div>
    </div>
  `;

  document.getElementById("searchCloseBtn").addEventListener("click", closeSearch);
  const input = document.getElementById("searchInput");
  input.addEventListener("input", (e) => {
    state.searchQuery = e.target.value;
    renderSearch();
    // re-focus + restore cursor position after re-render
    const newInput = document.getElementById("searchInput");
    if (newInput) {
      newInput.focus();
      const len = newInput.value.length;
      newInput.setSelectionRange(len, len);
    }
  });
  root.querySelectorAll(".search-player-row").forEach((row) => {
    row.addEventListener("click", () => {
      closeSearch();
      openPlayerModal(row.dataset.playerNumber, row.dataset.position);
    });
  });
}

/* ---- first-time mini guide ---- */
const GUIDE_STORAGE_KEY = "sw_guide_seen_v1";
const GUIDE_STEPS = [
  { icon: "🔴", title: "速報", desc: "海外組の試合結果・出場情報をタイムラインで確認できます。" },
  { icon: "🟡", title: "移籍", desc: "誰がどこへ移籍したかを、決定/噂で絞り込んで確認できます。" },
  { icon: "🟢", title: "選手", desc: "日本代表メンバーを一覧表示。タップで詳細とSNSが見られます。" },
  { icon: "🔵", title: "記事", desc: "サムライウォッチの記事とX投稿をまとめてチェックできます。" },
];

function showGuideIfFirstTime() {
  let seen = null;
  try {
    seen = window.localStorage.getItem(GUIDE_STORAGE_KEY);
  } catch {
    // localStorage unavailable — just skip the guide silently
    return;
  }
  if (seen) return;

  const root = document.getElementById("infoRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="guideOverlay">
      <div class="modal-sheet" style="position:relative;">
        <p class="section-eyebrow" style="--accent:${ACCENTS.scores}; margin-bottom:2px;">WELCOME</p>
        <h2 class="section-title" style="margin-bottom:2px;">SAMURAI WATCHの使い方</h2>
        <div>
          ${GUIDE_STEPS.map((s) => `
            <div class="guide-step">
              <span class="guide-step-icon">${s.icon}</span>
              <div>
                <p class="guide-step-title">${s.title}</p>
                <p class="guide-step-desc">${s.desc}</p>
              </div>
            </div>
          `).join("")}
        </div>
        <button class="guide-start-btn" id="guideStartBtn">はじめる</button>
      </div>
    </div>
  `;
  document.getElementById("guideStartBtn").addEventListener("click", () => {
    try {
      window.localStorage.setItem(GUIDE_STORAGE_KEY, "1");
    } catch {
      // ignore — worst case the guide shows again next visit
    }
    document.getElementById("infoRoot").innerHTML = "";
  });
}

function renderSectionHeading() {
  const h = SECTION_HEADINGS[state.activeTab];
  document.getElementById("sectionHeading").innerHTML = `
    <p class="section-eyebrow" style="--accent:${ACCENTS[state.activeTab]}">${h.eyebrow}</p>
    <h2 class="section-title">${h.title}</h2>
  `;
}

function renderFilterBlock() {
  const el = document.getElementById("filterBlock");
  if (state.activeTab !== "scores" && state.activeTab !== "transfers") {
    el.innerHTML = "";
    return;
  }
  const isScores = state.activeTab === "scores";
  const filters = isScores ? SCORE_FILTERS : TRANSFER_FILTERS;
  const activeId = isScores ? state.scoreFilter : state.transferFilter;
  const accent = ACCENTS[state.activeTab];
  el.innerHTML = `
    <div class="filter-block">
      <div class="filter-label" style="--accent:${accent}">
        <span class="filter-tag">FILTER</span>
      </div>
      <div class="filter-row">
        ${filters.map((f) => `
          <button class="filter-chip ${f.id === activeId ? "active" : ""}" data-filter="${f.id}" style="--accent:${accent}">${f.label}</button>
        `).join("")}
      </div>
    </div>
  `;
  el.querySelectorAll(".filter-chip").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (isScores) state.scoreFilter = btn.dataset.filter;
      else state.transferFilter = btn.dataset.filter;
      renderFilterBlock();
      renderContent();
    });
  });
}

function renderContent() {
  const content = document.getElementById("content");
  const tab = state.activeTab;

  if (tab === "articles") {
    content.innerHTML = renderArticlesTab();
    if (window.twttr && window.twttr.widgets) {
      window.twttr.widgets.load(content);
    }
    scheduleTwitterFallbackCheck(content);
    return;
  }

  if (tab === "players") {
    content.innerHTML = promoCard() + renderPlayersTab();
    content.querySelectorAll(".player-card").forEach((btn) => {
      btn.addEventListener("click", () => {
        openPlayerModal(btn.dataset.playerNumber, btn.dataset.position);
      });
    });
    return;
  }

  const feed = tab === "scores" ? state.scores : state.transfers;
  if (!feed) {
    content.innerHTML = `<div class="empty">読み込み中...</div>`;
    return;
  }

  let items = feed.items;
  if (tab === "scores" && state.scoreFilter !== "all") {
    items = items.filter((item) => scoreCategory(item) === state.scoreFilter);
  }
  if (tab === "transfers" && state.transferFilter !== "all") {
    items = items.filter((item) => transferCategory(item) === state.transferFilter);
  }
  // Defensive sort: the data should already come pre-sorted (trusted
  // sources first, newest within each tier) from fetch-news.mjs, but
  // sorting again here means the display stays correct even if a JSON
  // file is ever edited by hand or a fetch run predates a sort fix.
  items = prioritizeAndSort(items);

  if (items.length === 0) {
    content.innerHTML = `<div class="empty">該当する情報が見つかりませんでした。</div>`;
    return;
  }

  if (tab === "scores") {
    content.innerHTML = `<div class="timeline">${items.map((item) => renderTimelineCard(item, ACCENTS.scores)).join("")}</div>`;
  } else {
    content.innerHTML = items.map((item) => renderTransferCard(item, ACCENTS.transfers)).join("");
  }
}

function renderLiveBanner() {
  const timesEl = document.getElementById("liveTimes");
  let feed;
  if (state.activeTab === "transfers") feed = state.transfers;
  else if (state.activeTab === "articles") feed = state.articles;
  else if (state.activeTab === "players") feed = null;
  else feed = state.scores;

  if (state.activeTab === "players" || !feed || !feed.updatedAt) {
    timesEl.innerHTML = state.activeTab === "players" ? `選手データは手動更新` : `毎時0分に自動更新`;
    return;
  }
  const updated = new Date(feed.updatedAt);
  if (isNaN(updated.getTime())) {
    timesEl.innerHTML = `毎時0分に自動更新`;
    return;
  }
  const next = new Date(updated.getTime());
  next.setHours(next.getHours() + 1, 0, 0, 0);
  const fmt = (d) => d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  timesEl.innerHTML = `最終更新 <b>${fmt(updated)}</b> ・ 次回 <b>${fmt(next)}</b>`;
}

function renderAll() {
  renderDigest();
  renderSectionHeading();
  renderFilterBlock();
  renderContent();
  renderLiveBanner();
}

document.querySelectorAll(".tab-btn").forEach((btn) => {

    state.activeTab = btn.dataset.tab;
    renderAll();

});

(async function init() {
  try {
    const [scores, transfers, players, articles, config] = await Promise.all([
      loadJSON("./data/scores.json"),
      loadJSON("./data/transfers.json"),
      loadJSON("./data/players.json"),
      loadJSON("./data/articles.json"),
      loadJSON("./data/config.json"),
    ]);
    state.scores = scores;
    state.transfers = transfers;
    state.players = players;
    state.articles = articles;
    state.config = config;
  } catch (err) {
    console.error(err);
  }
  renderAll();
  showGuideIfFirstTime();
})();
