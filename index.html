<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SAMURAI WATCH | 海外組フォローアプリ</title>
<meta name="description" content="海外組の日本人選手に関する試合結果・移籍ニュースと、サムライウォッチの記事をまとめてチェックできるアプリ" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0c0c0f" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap');

  :root {
    --bg: #0c0c0f;
    --bg-header: rgba(12,12,15,0.95);
    --card: #141417;
    --border: #242429;
    --border-hover: #3a3a42;
    --text: #F2EFEA;
    --text-muted: #9a9aa2;
    --text-faint: #6b6b73;
    --text-fainter: #5b5f66;
    --red: #C81E3A;
    --red-hover: #b01a33;
    --gold: #B8934D;
    --blue: #7C9CBF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .font-display { font-family: 'Oswald', 'Noto Sans JP', sans-serif; }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg-header);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px 8px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1;
    margin: 0;
  }
  h1 span { color: var(--red); }
  .tagline { font-size: 11px; color: var(--text-faint); margin: 4px 0 0; }

  main {
    padding: 16px 16px 96px;
    max-width: 512px;
    margin: 0 auto;
  }

  .banner {
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #17141a;
    padding: 10px 12px;
    margin-bottom: 16px;
    font-size: 11.5px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .card {
    display: block;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    padding: 16px;
    margin-bottom: 12px;
    text-decoration: none;
    color: inherit;
  }
  .card:hover { border-color: var(--border-hover); }
  .card:hover h3 { color: #fff; }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .card-source {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .card-date { font-size: 11px; color: var(--text-faint); }
  .card h3 {
    font-size: 15px;
    line-height: 1.4;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--text);
  }
  .card p {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
    margin: 0;
  }
  .card-open {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-fainter);
  }

  .empty { text-align: center; padding: 64px 24px; color: #8a8a92; font-size: 14px; }

  nav.tabbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    background: var(--bg-header);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--border);
  }
  .tabbar-inner {
    display: flex;
    max-width: 512px;
    margin: 0 auto;
  }
  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 0;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text-faint);
    font-family: inherit;
  }
  .tab-btn svg { width: 20px; height: 20px; }
  .tab-btn span { font-size: 11px; margin-top: 4px; font-weight: 500; }
  .tab-btn.active { color: var(--accent, var(--red)); }

  @media (prefers-reduced-motion: no-preference) {
    .card { transition: border-color 0.15s ease; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1 class="font-display">SAMURAI <span>WATCH</span></h1>
      <p class="tagline">海外組フォローアプリ</p>
    </div>
  </div>
</header>

<main>
  <div class="banner" id="banner">読み込み中...</div>
  <div id="content"></div>
</main>

<nav class="tabbar">
  <div class="tabbar-inner">
    <button class="tab-btn active" data-tab="scores" style="--accent: #C81E3A;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
      <span>速報</span>
    </button>
    <button class="tab-btn" data-tab="transfers" style="--accent: #B8934D;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
      <span>移籍</span>
    </button>
    <button class="tab-btn" data-tab="articles" style="--accent: #7C9CBF;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>記事</span>
    </button>
  </div>
</nav>

<script>
const ACCENTS = { scores: "#C81E3A", transfers: "#B8934D", articles: "#7C9CBF" };
const state = { activeTab: "scores", scores: null, transfers: null, config: null };

async function loadJSON(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function timeAgo(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return "";
  const diffMs = Date.now() - d.getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "たった今";
  if (mins < 60) return `${mins}分前`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}時間前`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}日前`;
  return d.toLocaleDateString("ja-JP", { month: "short", day: "numeric" });
}

function renderCard(item, accent) {
  return `
    <a class="card" href="${item.link}" target="_blank" rel="noopener noreferrer">
      <div class="card-top">
        <span class="card-source" style="color:${accent}">${item.source || "ニュース"}</span>
        <span class="card-date">${timeAgo(item.pubDate)}</span>
      </div>
      <h3>${item.title}</h3>
      <p>${item.description || ""}</p>
      <div class="card-open">開く</div>
    </a>
  `;
}

function renderArticlesTab() {
  const user = state.config?.noteUser || "samurai_watch";
  return `
    <a class="card" href="https://note.com/${encodeURIComponent(user)}" target="_blank" rel="noopener noreferrer">
      <span class="card-source" style="color:${ACCENTS.articles}">note.com</span>
      <h3 style="margin-top:8px;">サムライウォッチの記事一覧を開く</h3>
      <p>note.com/${user} で公開中の無料記事・有料タクティカル分析をまとめて確認できます。</p>
      <div class="card-open">noteで開く</div>
    </a>
  `;
}

function render() {
  const content = document.getElementById("content");
  const tab = state.activeTab;

  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.tab === tab);
  });

  if (tab === "articles") {
    content.innerHTML = renderArticlesTab();
    return;
  }

  const feed = tab === "scores" ? state.scores : state.transfers;
  if (!feed) {
    content.innerHTML = `<div class="empty">読み込み中...</div>`;
    return;
  }
  if (feed.items.length === 0) {
    content.innerHTML = `<div class="empty">記事が見つかりませんでした。</div>`;
    return;
  }
  content.innerHTML = feed.items.map((item) => renderCard(item, ACCENTS[tab])).join("");
}

function renderBanner() {
  const banner = document.getElementById("banner");
  const feed = state.activeTab === "transfers" ? state.transfers : state.scores;
  if (state.activeTab === "articles" || !feed) {
    banner.textContent = "1時間ごとに自動更新されます。";
    return;
  }
  const updated = new Date(feed.updatedAt);
  const label = isNaN(updated.getTime()) ? "" : updated.toLocaleString("ja-JP", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  banner.textContent = `最終更新: ${label}(1時間ごとに自動更新)`;
}

document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.activeTab = btn.dataset.tab;
    render();
    renderBanner();
  });
});

(async function init() {
  try {
    const [scores, transfers, config] = await Promise.all([
      loadJSON("./data/scores.json"),
      loadJSON("./data/transfers.json"),
      loadJSON("./data/config.json"),
    ]);
    state.scores = scores;
    state.transfers = transfers;
    state.config = config;
  } catch (err) {
    document.getElementById("banner").textContent = "データの読み込みに失敗しました。";
    console.error(err);
  }
  render();
  renderBanner();
})();
</script>
</body>
</html>
