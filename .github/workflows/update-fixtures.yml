name: Update Fixtures Data

on:
  schedule:
    # Every 3 hours. Fixtures/results don't change minute-to-minute, and
    # this keeps well within football-data.org's free-tier rate limit
    # across the day.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  update-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest fixtures
        id: fetch
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/fetch-fixtures.mjs
        continue-on-error: true

      - name: Commit and push if changed
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          git diff --staged --quiet || git commit -m "chore: update fixtures data [skip ci]"
          git push

      - name: Create GitHub issue on failure
        if: steps.fetch.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "⚠️ SAMURAI WATCH: 試合データ取得に失敗 ($(date -u +'%Y-%m-%d %H:%M UTC'))" \
            --body "fetch-fixtures.mjs が失敗しました。FOOTBALL_DATA_API_KEY が正しく設定されているか確認してください。

          実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Fail the job if the fetch step failed
        if: steps.fetch.outcome != 'success'
        run: exit 1
